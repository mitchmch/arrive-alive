org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Mapbox SDK downloads token (secret token with Downloads:Read scope)
# Create at https://account.mapbox.com/ -> Tokens -> Create secret token
# This is read by the mapbox_maps_flutter plugin's build.gradle
# Set SDK_REGISTRY_TOKEN and MAPBOX_DOWNLOADS_TOKEN in
# ~/.gradle/gradle.properties on your development machine. Never commit them.
