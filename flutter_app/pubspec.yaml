name: arrive_alive
description: Road Safety for Cameroon - Monitor speeds, report violations, stay safe.
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.1

  # Networking
  http: ^1.1.2
  dio: ^5.4.0

  # Maps & Location
  mapbox_maps_flutter: ^2.28.0
  google_maps_flutter: ^2.5.3  # fallback if Mapbox token not set
  geolocator: ^10.1.0
  geocoding: ^5.0.0

  # Firebase & Push Notifications
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.2.1

  # Offline-first local database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Connectivity detection
  connectivity_plus: ^7.3.1

  # Text-to-speech for voice navigation
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0

  # UI & Utilities
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  cached_network_image: ^3.3.0
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  intl: ^0.18.1
  uuid: ^4.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4361EE"
  adaptive_icon_foreground: "assets/images/logo.png"
  ios_remove_transparent_border: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/map_styles/
    - assets/images/
    - assets/sounds/
